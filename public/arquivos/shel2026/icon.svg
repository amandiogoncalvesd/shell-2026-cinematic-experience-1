<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Beautiful Dark Space Gradient Background matching safe colors -->
  <defs>
    <radialGradient id="space-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#081B33" />
      <stop offset="100%" stop-color="#040B16" />
    </radialGradient>
    
    <!-- Royal Elegant Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEFA6" />
      <stop offset="50%" stop-color="#FFD36B" />
      <stop offset="100%" stop-color="#DCA134" />
    </linearGradient>

    <!-- Celestial Pearl Pink Accent -->
    <linearGradient id="pink-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8D8E8" />
      <stop offset="100%" stop-color="#8ECFFF" />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="112" fill="url(#space-grad)" stroke="#FFD36B" stroke-width="4" stroke-opacity="0.3" />

  <!-- Constellation Ambient Nebula -->
  <circle cx="256" cy="256" r="180" fill="url(#pink-grad)" filter="url(#soft-glow)" opacity="0.15" />

  <!-- Geometrical Astrolabe Star Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold-grad)" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="8,8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#8ECFFF" stroke-width="0.75" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="4,12" />

  <!-- Guiding Axis lines -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="url(#gold-grad)" stroke-width="0.5" stroke-opacity="0.2" />
  <line x1="40" y1="256" x2="472" y2="256" stroke="url(#gold-grad)" stroke-width="0.5" stroke-opacity="0.2" />

  <!-- Monogram Monolith Core "SF" for Shelcia Fernanda -->
  <g transform="translate(0, 5)">
    <!-- Custom Crown of 18 Autumns -->
    <path d="M196 160 L220 210 L256 180 L292 210 L316 160 L336 240 L176 240 Z" fill="url(#gold-grad)" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.5))" />
    <circle cx="196" cy="154" r="5" fill="#FFFFFF" />
    <circle cx="256" cy="174" r="6" fill="#FFFFFF" />
    <circle cx="316" cy="154" r="5" fill="#FFFFFF" />

    <!-- Royal Monogram Letter 'S' and 'F' joined -->
    <text x="256" y="340" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="108" font-weight="300" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="-2" filter="drop-shadow(0px 8px 16px rgba(4,11,22,0.6))">SF</text>
    
    <!-- Ribbons/Wings of Light -->
    <path d="M140 290 Q200 280 256 320 Q312 280 372 290" fill="none" stroke="url(#pink-grad)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Golden Beacon North Star (Top center focal point) -->
  <g transform="translate(256, 80)">
    <path d="M0 -15 L3 -4 L14 0 L3 4 L0 15 L-3 4 L-14 0 L-3 -4 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="3" fill="#FFD36B" />
  </g>

  <!-- Star Embellishments -->
  <circle cx="110" cy="150" r="3" fill="#FFFFFF" opacity="0.6" />
  <circle cx="400" cy="150" r="2.5" fill="#8ECFFF" opacity="0.8" />
  <circle cx="120" cy="380" r="4" fill="#FFD36B" opacity="0.7" />
  <circle cx="380" cy="380" r="3" fill="#F8D8E8" opacity="0.9" />
</svg>

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEURAL PUZZLE — SHELL 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#03101f}
body{font-family:'Orbitron',monospace;display:flex;flex-direction:column}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:997;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px)}

/* ══ HUD ══ */
#hud{flex-shrink:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 12px;
  background:rgba(4,14,28,0.97);border-bottom:1px solid rgba(135,195,227,0.2);
  position:relative;z-index:20;overflow:hidden}
#hud::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,#87C3E3 20%,#9F7CA9 50%,#DA8BA0 80%,transparent)}

.logo{font-size:12px;font-weight:900;letter-spacing:2.5px;white-space:nowrap;flex-shrink:0;
  background:linear-gradient(135deg,#87C3E3,#9F7CA9 50%,#DA8BA0);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.hud-sep{width:1px;height:30px;background:rgba(135,195,227,0.3);flex-shrink:0}

.level-info{display:flex;flex-direction:column;justify-content:center;flex-shrink:0}
.level-tag{font-size:7px;letter-spacing:3px;color:rgba(218,139,160,0.8);line-height:1}
.level-name{font-size:11px;font-weight:800;letter-spacing:2px;color:#DA8BA0;
  text-shadow:0 0 10px rgba(218,139,160,0.6);line-height:1.4}
.grid-tag{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(217,184,227,0.7);line-height:1}

.hud-stats{display:flex;gap:14px;align-items:center}
.stat{text-align:center;min-width:46px}
.stat-l{font-family:'Share Tech Mono',monospace;font-size:6px;color:rgba(185,217,236,0.4);letter-spacing:2px}
.stat-v{font-family:'Share Tech Mono',monospace;font-size:13px;font-weight:700;
  color:#D9B8E3;text-shadow:0 0 8px rgba(217,184,227,0.6)}

.hud-btns{display:flex;gap:5px;margin-left:auto;flex-shrink:0}
.btn{font-family:'Orbitron',monospace;font-size:6.5px;font-weight:700;letter-spacing:1.2px;
  padding:5px 9px;border:1px solid;cursor:pointer;background:transparent;
  transition:all .15s;white-space:nowrap;line-height:1}
.b-blue{border-color:#87C3E3;color:#87C3E3}
.b-blue:hover{background:#87C3E3;color:#fff;box-shadow:0 0 12px rgba(135,195,227,.8)}
.b-purple{border-color:#9F7CA9;color:#9F7CA9}
.b-purple:hover{background:#9F7CA9;color:#fff;box-shadow:0 0 12px rgba(159,124,169,.8)}
.b-red{border-color:#DA8BA0;color:#DA8BA0}
.b-red:hover{background:#DA8BA0;color:#fff;box-shadow:0 0 12px rgba(218,139,160,.8)}
.b-amber{border-color:#5A75C2;color:#5A75C2}
.b-amber:hover{background:#5A75C2;color:#000;box-shadow:0 0 12px rgba(90,117,194,.8)}
.b-green{border-color:#04d98b;color:#04d98b}
.b-green:hover{background:#04d98b;color:#000;box-shadow:0 0 12px rgba(4,217,139,.8)}

/* level progress dots */
#lvl-bar{flex-shrink:0;display:flex;gap:4px;align-items:center}
.lvl-dot{width:7px;height:7px;border:1px solid rgba(135,195,227,0.3);border-radius:50%;
  transition:all .3s;cursor:default;flex-shrink:0}
.lvl-dot.done{background:#87C3E3;border-color:#87C3E3;box-shadow:0 0 6px #87C3E3}
.lvl-dot.current{background:transparent;border-color:#D9B8E3;box-shadow:0 0 6px #D9B8E3;animation:pulse-dot 1s ease-in-out infinite alternate}
@keyframes pulse-dot{from{box-shadow:0 0 4px #D9B8E3}to{box-shadow:0 0 12px #D9B8E3,0 0 20px #D9B8E3}}

/* ══ GAME AREA ══ */
#gameArea{flex:1;position:relative;overflow:hidden}
#c{display:block}

/* ══ PROGRESS ══ */
#prog-wrap{flex-shrink:0;height:3px;background:rgba(255,255,255,0.04)}
#prog-bar{height:100%;width:0%;background:linear-gradient(90deg,#87C3E3,#9F7CA9,#DA8BA0);
  box-shadow:0 0 8px #9F7CA9;transition:width .4s}

/* ══ LOADING ══ */
#loading{position:fixed;inset:0;z-index:1000;background:#03101f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#loading.out{opacity:0;pointer-events:none}
.ld-logo{font-size:24px;font-weight:900;letter-spacing:5px;text-align:center;line-height:1.4;
  background:linear-gradient(135deg,#87C3E3,#9F7CA9,#DA8BA0);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ld-grid{width:54px;height:54px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;animation:rot 3s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ld-cell{border:1px solid;animation:cc 1.5s ease-in-out infinite alternate}
.ld-cell:nth-child(1){border-color:#DA8BA0;animation-delay:0s}
.ld-cell:nth-child(2){border-color:#9F7CA9;animation-delay:.15s}
.ld-cell:nth-child(3){border-color:#D9B8E3;animation-delay:.3s}
.ld-cell:nth-child(4){border-color:#87C3E3;animation-delay:.45s}
.ld-cell:nth-child(5){border-color:#5A75C2;animation-delay:.6s}
.ld-cell:nth-child(6){border-color:#DA8BA0;animation-delay:.75s}
.ld-cell:nth-child(7){border-color:#9F7CA9;animation-delay:.9s}
.ld-cell:nth-child(8){border-color:#D9B8E3;animation-delay:1.05s}
.ld-cell:nth-child(9){border-color:#87C3E3;animation-delay:1.2s}
@keyframes cc{from{opacity:.15}to{opacity:1}}
.ld-txt{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:4px;color:#87C3E3;animation:blink 1.2s step-end infinite}
@keyframes blink{50%{opacity:0}}
.ld-bar{width:180px;height:1px;background:rgba(135,195,227,.1);position:relative;overflow:hidden}
.ld-bar::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,#87C3E3,#9F7CA9,transparent);animation:la 1.4s linear infinite}
@keyframes la{to{left:100%}}
.ld-level{font-family:'Share Tech Mono',monospace;font-size:11px;color:#D9B8E3;letter-spacing:3px;text-shadow:0 0 10px #D9B8E3}

/* ══ PREVIEW ══ */
#prev-ov{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  opacity:0;pointer-events:none;transition:opacity .3s}
#prev-ov.show{opacity:1;pointer-events:auto}
#prev-ov img{max-width:70vw;max-height:70vh;border:1px solid #9F7CA9;
  box-shadow:0 0 30px rgba(159,124,169,.5),0 0 80px rgba(159,124,169,.15)}
.prev-l{font-size:8px;letter-spacing:3px;color:rgba(159,124,169,.6)}

/* ══ WIN ══ */
#win-ov{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.93);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  opacity:0;pointer-events:none;transition:opacity .5s}
#win-ov.show{opacity:1;pointer-events:auto}
.win-t{font-size:28px;font-weight:900;letter-spacing:4px;text-align:center;
  background:linear-gradient(135deg,#D9B8E3,#5A75C2,#DA8BA0);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:gp 1s ease-in-out infinite alternate}
@keyframes gp{from{filter:brightness(1)}to{filter:brightness(1.6) drop-shadow(0 0 20px #D9B8E3)}}
.win-lvl{font-size:11px;letter-spacing:4px;color:#9F7CA9;text-shadow:0 0 12px #9F7CA9}
.win-s{font-family:'Share Tech Mono',monospace;font-size:12px;color:#D9B8E3;
  text-align:center;line-height:2.3;letter-spacing:1.5px}
.win-dec{width:180px;height:1px;background:linear-gradient(90deg,transparent,#D9B8E3,transparent);box-shadow:0 0 6px #D9B8E3}
.win-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.win-btn{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;letter-spacing:2px;
  padding:10px 22px;border:1px solid;cursor:pointer;background:transparent;transition:all .15s}

/* ══ STARS ══ */
.stars{display:flex;gap:8px;font-size:20px}

/* ══ MAX LEVEL ══ */
.max-badge{font-size:13px;letter-spacing:4px;padding:6px 18px;border:2px solid #D9B8E3;
  color:#D9B8E3;text-shadow:0 0 15px #D9B8E3;box-shadow:0 0 20px rgba(217,184,227,.3);
  animation:gp 1.5s ease-in-out infinite alternate}

/* ── Melhorias de interface (mobile + progresso) ── */
.hud-btns{flex-wrap:wrap;justify-content:flex-end;row-gap:4px}
#btn-photo{background:#87C3E3;color:#0a2540;border-color:#87C3E3;font-weight:800;box-shadow:0 0 14px rgba(135,195,227,.55)}
#btn-photo:hover{background:#bfe4f7;color:#0a2540;box-shadow:0 0 20px rgba(135,195,227,.8)}
.ld-progress{width:230px;height:4px;border-radius:99px;background:rgba(135,195,227,.12);overflow:hidden;margin-top:2px}
.ld-progress-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#87C3E3,#D9B8E3);box-shadow:0 0 10px rgba(135,195,227,.7);transition:width .25s ease}
.ld-pct{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:3px;color:#D9B8E3;text-shadow:0 0 10px rgba(217,184,227,.6)}
@media (max-width:640px){
  #hud{height:auto;min-height:56px;flex-wrap:wrap;padding:8px 10px}
  .hud-stats{gap:10px}
}

/* ── Refinamento final do HUD: botões pill, tudo encaixado ── */
#hud{height:auto;min-height:56px;flex-wrap:wrap;padding:8px 12px;overflow:visible;gap:8px 12px}
.logo{font-size:11px}
.level-info .level-name{font-size:10px}
.grid-tag{font-size:8px}
.hud-btns{margin-left:auto;flex-wrap:wrap;justify-content:flex-end;row-gap:5px;max-width:100%}
.btn{border-radius:999px;padding:6px 11px;font-size:7.5px}
.btn:hover{transform:translateY(-1px)}
.win-btn{border-radius:999px}
#resume-ov .win-btn{border-radius:999px}
@media (max-width:480px){
  #hud{gap:6px 8px;padding:6px 8px}
  .hud-sep{display:none}
  #lvl-bar{order:3;width:100%;justify-content:center;margin-top:2px}
  .hud-stats{gap:8px}
  .stat{min-width:38px}
  .stat-v{font-size:11px}
  .btn{padding:5px 9px;font-size:7px;letter-spacing:1px}
  .logo{font-size:10px;letter-spacing:2px}
  .level-info .level-name{font-size:9px}
}
@media (max-width:350px){
  .logo{display:none}
}
</style>
</head>

function shufflePool(){
  imgPool=[...ALL_IMGS];
  for(let i=imgPool.length-1;i>0;i--){
    const j=(Math.random()*(i+1))|0;
    [imgPool[i],imgPool[j]]=[imgPool[j],imgPool[i]];
  }
}
function nextImg(){
  if(!imgPool.length) shufflePool();
  // Avoid immediate repeat
  if(imgPool.length>1&&imgPool[imgPool.length-1]===usedImgUrl) imgPool.unshift(imgPool.pop());
  return imgPool.pop();
}

// ════════════════════════════════════════════════

function setLoadProgress(p){
  const fill=document.getElementById('ld-fill');
  const pct=document.getElementById('ld-pct');
  if(fill) fill.style.width=p+'%';
  if(pct) pct.textContent=p+'%';
}

function fetchWithProgress(url, onProgress){
  return fetch(url).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    const total=parseInt(res.headers.get('content-length')||'0',10);
    if(!res.body || !total) return res.blob();
    const reader=res.body.getReader();
    let received=0; const chunks=[];
    function pump(){
      return reader.read().then(function(r){
        if(r.done) return;
        chunks.push(r.value); received+=r.value.length;
        onProgress(Math.min(100, Math.round(received/total*100)));
        return pump();
      });
    }
    return pump().then(function(){ return new Blob(chunks); });
  }).then(function(blob){ return URL.createObjectURL(blob); });
}

function finishLoad(src, origUrl, sameLevel){
  const im=new Image();
  im.onload=function(){
    image=im;
    document.getElementById('prev-img').src=origUrl;
    setLoadProgress(100);
    setTimeout(function(){ hideLoading(); startGame(sameLevel); },500);
  };
  im.onerror=function(){ loadImage(sameLevel); };
  im.src=src;
}

function loadImage(sameLevel=false){
  const url=nextImg();
  usedImgUrl=url;
  showLoading(true);
  setLoadProgress(0);
  fetchWithProgress(url, setLoadProgress)
    .then(function(blobUrl){ finishLoad(blobUrl, url, sameLevel); })
    .catch(function(){
      const fallback=nextImg();
      usedImgUrl=fallback;
      fetchWithProgress(fallback, setLoadProgress)
        .then(function(blobUrl){ finishLoad(blobUrl, fallback, sameLevel); })
        .catch(function(){
          const im=new Image();
          im.onload=function(){ finishLoad(url, url, sameLevel); };
          im.onerror=function(){ loadImage(sameLevel); };
          im.src=url;
        });
    });
}

function showLoading(visible){
  const ld=document.getElementById('loading');

function startGame(keepLevel=false){

  // Dynamic tab & snap
  if(grid<=3)      {TAB=0.30;SNAP_T=0.42;}
  else if(grid<=6) {TAB=0.26;SNAP_T=0.40;}
  else if(grid<=9) {TAB=0.22;SNAP_T=0.38;}
  else             {TAB=0.18;SNAP_T=0.36;}

  placed=0; moves=0; snaps=[]; particles=[]; pulses=[]; hov=null; drag=null;
  document.getElementById('win-ov').classList.remove('show');

  recalcBoard();
  genEdges(); genPieces(); doShuffle();
  updateHUD(); updateLevelBar();

  t0=Date.now();
  clearInterval(tid); tid=setInterval(tickTimer,1000);
  active=true;
}

  level=0; completedLevels=[];

  loadImage(false);
}

// ════════════════════════════════════════════════
//  BOARD
// ════════════════════════════════════════════════
function recalcBoard(){
  const cw=cv.width,ch=cv.height;
  const TW=Math.min(cw*0.32,260);
  const PAD=20;
  const asp=image.width/image.height;
  let bw=cw-TW-PAD*3, bh=bw/asp;
  if(bh>ch-PAD*2){bh=ch-PAD*2; bw=bh*asp;}
  board.w=bw; board.h=bh;
  board.x=TW+PAD*2; board.y=(ch-bh)/2;
  pw=bw/grid; ph=bh/grid;
}
function repoPlaced(){
  pieces.forEach(p=>{if(p.placed){p.x=board.x+p.c*pw;p.y=board.y+p.r*ph;}});
}

// ════════════════════════════════════════════════
//  EDGES
// ════════════════════════════════════════════════
function genEdges(){
  hEdges=Array.from({length:grid-1},()=>Array.from({length:grid},()=>Math.random()>.5?1:-1));
  vEdges=Array.from({length:grid},()=>Array.from({length:grid-1},()=>Math.random()>.5?1:-1));
}
function getE(r,c){
  return{
    top:   r===0     ?0:-hEdges[r-1][c],
    bottom:r===grid-1?0: hEdges[r][c],
    left:  c===0     ?0:-vEdges[r][c-1],
    right: c===grid-1?0: vEdges[r][c]
  };
}
function genPieces(){
  pieces=[];
  for(let r=0;r<grid;r++)
    for(let c=0;c<grid;c++)
      pieces.push({r,c,x:0,y:0,edges:getE(r,c),placed:false,dragging:false,snap:0});
}

// ════════════════════════════════════════════════
//  SCATTER
// ════════════════════════════════════════════════
function doShuffle(){
  pieces.forEach(p=>p.placed=false);
  placed=0; updateHUD();
  const TW=board.x-18;
  const arr=[...pieces];
  for(let i=arr.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[arr[i],arr[j]]=[arr[j],arr[i]];}
  const cols=Math.max(2,Math.floor(TW/(pw+6)));
  const rows=Math.ceil(arr.length/cols);
  const cw=(TW-10)/cols, ch=(cv.height-10)/rows;
  arr.forEach((p,i)=>{
    const col=i%cols,row=(i/cols)|0;
    p.x=5+col*cw+Math.random()*Math.max(cw-pw-5,1);
    p.y=5+row*ch+Math.random()*Math.max(ch-ph-5,1);
    p.x=Math.max(2,Math.min(p.x,TW-pw-2));
    p.y=Math.max(2,Math.min(p.y,cv.height-ph-2));
  });
}
function doHint(){
  const ov=document.getElementById('prev-ov');
  ov.classList.add('show');
  setTimeout(()=>ov.classList.remove('show'),3000);
}

// ════════════════════════════════════════════════
//  JIGSAW PATH
// ════════════════════════════════════════════════
function piecePath(px,py,W,H,e){
  ctx.beginPath(); ctx.moveTo(px,py);
  drawEdge(px,py,px+W,py,e.top);
  drawEdge(px+W,py,px+W,py+H,e.right);
  drawEdge(px+W,py+H,px,py+H,e.bottom);
  drawEdge(px,py+H,px,py,e.left);
  ctx.closePath();
}
function drawEdge(x1,y1,x2,y2,dir){
  if(!dir){ctx.lineTo(x2,y2);return;}
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
  const ax=dx/len,ay=dy/len;
  const nx=ay*dir,ny=-ax*dir;
  const tw=len*TAB*.9,th=len*TAB;
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  const b1x=mx-ax*tw,b1y=my-ay*tw;
  const b2x=mx+ax*tw,b2y=my+ay*tw;
  const tipX=mx+nx*th,tipY=my+ny*th;
  ctx.lineTo(b1x,b1y);
  ctx.bezierCurveTo(b1x+nx*th*.7,b1y+ny*th*.7,tipX-ax*tw*.6,tipY-ay*tw*.6,tipX,tipY);
  ctx.bezierCurveTo(tipX+ax*tw*.6,tipY+ay*tw*.6,b2x+nx*th*.7,b2y+ny*th*.7,b2x,b2y);
  ctx.lineTo(x2,y2);
}

// ════════════════════════════════════════════════
//  RENDER LOOP
// ════════════════════════════════════════════════
function loop(){frame++;drawAll();requestAnimationFrame(loop);}
function drawAll(){
  const cw=cv.width,ch=cv.height;
  ctx.clearRect(0,0,cw,ch);
  drawBg(cw,ch); drawTray(cw,ch); drawBoard();
  drawPieces(); drawSnaps(); drawPulses(); drawParticles();
}

function drawBg(cw,ch){
  ctx.fillStyle='#03101f';ctx.fillRect(0,0,cw,ch);
  ctx.fillStyle='rgba(135,195,227,0.08)';
  for(let x=0;x<cw;x+=30)for(let y=0;y<ch;y+=30){
    ctx.beginPath();ctx.arc(x,y,.8,0,6.28);ctx.fill();
  }
  const t=frame/60;
  bgStars.forEach(s=>{
    const a=s.a*(0.5+0.5*Math.sin(t*s.sp+s.x*.1));
    ctx.fillStyle=`rgba(190,225,250,${a})`;
    ctx.beginPath();ctx.arc(s.x%cw,s.y%ch,s.r,0,6.28);ctx.fill();
  });
}

function drawTray(cw,ch){
  const TW=board.x-18;
  ctx.fillStyle='rgba(6,21,39,0.92)';ctx.fillRect(0,0,TW,ch);
  // Divider rainbow
  const g=ctx.createLinearGradient(TW-1,0,TW+1,0);
  g.addColorStop(0,`rgba(135,195,227,.7)`);g.addColorStop(.5,`rgba(159,124,169,.7)`);g.addColorStop(1,`rgba(218,139,160,.7)`);
  ctx.fillStyle=g;ctx.fillRect(TW-1,0,2,ch);
  // Label
  ctx.save();ctx.translate(12,ch/2);ctx.rotate(-Math.PI/2);
  ctx.font='700 7px Orbitron,monospace';
  ctx.fillStyle='rgba(135,195,227,.22)';ctx.textAlign='center';
  ctx.fillText('⬡ PEÇAS DISPONÍVEIS ⬡',0,0);ctx.restore();
  // Remaining count
  const rem=pieces.filter(p=>!p.placed).length;
  const total=grid*grid;
  ctx.font=`700 ${grid<=4?12:grid<=7?10:8}px Share Tech Mono,monospace`;
  ctx.fillStyle='rgba(90,117,194,.55)';ctx.textAlign='center';
  ctx.fillText(rem+'/'+total+' restantes',TW/2,ch-12);
}

function drawBoard(){
  if(!image)return;
  const{x,y,w,h}=board;
  ctx.globalAlpha=0.06;ctx.drawImage(image,x,y,w,h);ctx.globalAlpha=1;
  // Grid dashes
  ctx.save();ctx.strokeStyle='rgba(135,195,227,.18)';ctx.lineWidth=1;ctx.setLineDash([2,5]);
  for(let r=0;r<=grid;r++){ctx.beginPath();ctx.moveTo(x,y+r*ph);ctx.lineTo(x+w,y+r*ph);ctx.stroke();}
  for(let c=0;c<=grid;c++){ctx.beginPath();ctx.moveTo(x+c*pw,y);ctx.lineTo(x+c*pw,y+h);ctx.stroke();}
  ctx.setLineDash([]);ctx.restore();
  // Board glow
  ctx.strokeStyle='rgba(135,195,227,.4)';ctx.lineWidth=1.5;
  ctx.shadowColor=COL.b;ctx.shadowBlur=14;ctx.strokeRect(x,y,w,h);ctx.shadowBlur=0;
  // Corners
  const CC=[COL.b,COL.r,COL.p,COL.a];
  [[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(([cx,cy],i)=>{
    const ox=cx===x?1:-1,oy=cy===y?1:-1,s=12;
    ctx.strokeStyle=CC[i];ctx.lineWidth=2;ctx.shadowColor=CC[i];ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(cx+ox*(s+1),cy);ctx.lineTo(cx,cy);ctx.lineTo(cx,cy+oy*(s+1));
    ctx.stroke();ctx.shadowBlur=0;
  });
  // Level watermark
  ctx.font=`700 ${Math.max(10,Math.min(18,pw*.5))}px Orbitron,monospace`;
  ctx.fillStyle='rgba(135,195,227,0.06)';ctx.textAlign='center';
  ctx.fillText(LEVEL_NAMES[level],x+w/2,y+h/2+6);
}

function drawPieces(){
  if(!image)return;
  const sorted=[...pieces].sort((a,b)=>{
    if(a.dragging)return 1;if(b.dragging)return -1;
    if(a.placed!==b.placed)return a.placed?-1:1;return 0;
  });
  const scX=pw/(image.width/grid), scY=ph/(image.height/grid);
  sorted.forEach(p=>{
    // Shadow for lifted pieces
    if(p.dragging||p===hov){
      ctx.save();
      ctx.translate(p.x+(p.dragging?5:2),p.y+(p.dragging?7:3));
      piecePath(0,0,pw,ph,p.edges);
      ctx.fillStyle='rgba(0,0,0,0.4)';
      try{ctx.filter=`blur(${p.dragging?5:3}px)`;}catch(e){}
      ctx.fill();ctx.filter='none';ctx.restore();
    }
    ctx.save();ctx.translate(p.x,p.y);
    piecePath(0,0,pw,ph,p.edges);ctx.clip();
    ctx.drawImage(image,-p.c*pw,-p.r*ph,image.width*scX,image.height*scY);
    if(p.dragging){ctx.fillStyle='rgba(135,195,227,.15)';ctx.fill();}
    else if(p===hov){ctx.fillStyle='rgba(135,195,227,.07)';ctx.fill();}
    ctx.restore();
    // Outline
    ctx.save();ctx.translate(p.x,p.y);
    piecePath(0,0,pw,ph,p.edges);
    if(p.snap>0){
      ctx.strokeStyle=`rgba(217,184,227,${p.snap})`;ctx.lineWidth=2.5;
      ctx.shadowColor=COL.a;ctx.shadowBlur=12*p.snap;
      p.snap=Math.max(0,p.snap-.02);
    } else if(p.placed){
      ctx.strokeStyle='rgba(217,184,227,.2)';ctx.lineWidth=Math.max(.5,1-grid*.04);
    } else if(p.dragging){
      ctx.strokeStyle=COL.b;ctx.lineWidth=1.8;ctx.shadowColor=COL.b;ctx.shadowBlur=10;
    } else if(p===hov){
      ctx.strokeStyle='rgba(135,195,227,.8)';ctx.lineWidth=1.4;ctx.shadowColor=COL.b;ctx.shadowBlur=7;
    } else {
      ctx.strokeStyle='rgba(135,195,227,.28)';ctx.lineWidth=Math.max(.4,.8-grid*.04);
    }
    ctx.stroke();ctx.shadowBlur=0;ctx.restore();
  });
}

function drawSnaps(){
  snaps=snaps.filter(s=>s.t<1);
  snaps.forEach(s=>{
    const a=1-s.t;
    ctx.beginPath();ctx.arc(s.x,s.y,50*s.t,0,6.28);
    ctx.strokeStyle=`rgba(217,184,227,${a*.8})`;ctx.lineWidth=2;
    ctx.shadowColor=COL.a;ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(s.x,s.y,25*s.t,0,6.28);
    ctx.strokeStyle=`rgba(90,117,194,${a*.5})`;ctx.lineWidth=1.5;ctx.stroke();
    s.t+=0.05;
  });
}
function drawPulses(){
  pulses=pulses.filter(p=>p.t<1);
  pulses.forEach(p=>{
    ctx.beginPath();ctx.arc(p.x,p.y,70*p.t,0,6.28);
    ctx.strokeStyle=`rgba(135,195,227,${(1-p.t)*.4})`;ctx.lineWidth=1;ctx.stroke();
    p.t+=0.03;
  });
}
function drawParticles(){
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/p.ml;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*(p.life/p.ml),0,6.28);ctx.fill();
    p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.99;p.life--;
  });
  ctx.globalAlpha=1;
}

// ════════════════════════════════════════════════
//  INTERACTION
// ════════════════════════════════════════════════
function getPos(e){
  const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)};
}
function pieceAt(mx,my){
  for(let i=pieces.length-1;i>=0;i--){
    const p=pieces[i];if(p.placed)continue;
    if(mx>=p.x&&mx<=p.x+pw&&my>=p.y&&my<=p.y+ph)return p;
  }
  return null;
}
function onDown(e){const{x,y}=getPos(e);const p=pieceAt(x,y);if(!p)return;drag=p;p.dragging=true;dox=x-p.x;doy=y-p.y;pieces.splice(pieces.indexOf(p),1);pieces.push(p);cv.style.cursor='grabbing';}
function onMove(e){const{x,y}=getPos(e);if(drag){drag.x=x-dox;drag.y=y-doy;}else{hov=pieceAt(x,y)||null;cv.style.cursor=hov?'grab':'default';}}
function onUp(){if(!drag)return;drag.dragging=false;moves++;trySnap(drag);drag=null;cv.style.cursor='default';updateHUD();}
function onTS(e){e.preventDefault();const t=e.touches[0],{x,y}=getPos(t);const p=pieceAt(x,y);if(!p)return;drag=p;p.dragging=true;dox=x-p.x;doy=y-p.y;pieces.splice(pieces.indexOf(p),1);pieces.push(p);}
function onTM(e){e.preventDefault();if(!drag)return;const t=e.touches[0],{x,y}=getPos(t);drag.x=x-dox;drag.y=y-doy;}
function onTE(){if(!drag)return;drag.dragging=false;moves++;trySnap(drag);drag=null;updateHUD();}

// ════════════════════════════════════════════════
//  SNAP
// ════════════════════════════════════════════════
function trySnap(p){
  const tx=board.x+p.c*pw,ty=board.y+p.r*ph;
  const thr=Math.min(pw,ph)*SNAP_T;
  if(Math.abs(p.x-tx)<thr&&Math.abs(p.y-ty)<thr){
    p.x=tx;p.y=ty;p.placed=true;p.snap=1;placed++;
    snaps.push({x:tx+pw/2,y:ty+ph/2,t:0});
    pulses.push({x:tx+pw/2,y:ty+ph/2,t:0});
    if(placed===grid*grid)setTimeout(doWin,500);
  }
}

// ════════════════════════════════════════════════
//  WIN
// ════════════════════════════════════════════════
function doWin(){
  active=false;clearInterval(tid);
  completedLevels.push(level);
  const el=(Date.now()-t0)/1000|0;
  const mm=String((el/60)|0).padStart(2,'0'),ss=String(el%60).padStart(2,'0');
  const total=grid*grid;
  const isMax=level>=MAX_LEVEL;
  // Star rating
  const perfect=moves<=total+2&&el<30;
  const great=moves<=total*1.5&&el<90;
  const good=moves<=total*2.5&&el<300;
  const stars=perfect?'★★★':great?'★★☆':good?'★☆☆':'☆☆☆';
  // Score
  const score=Math.max(0,Math.round(10000-moves*15-el*3+(level*500)));
  // Win title
  const titles=['BEM FEITO!','MUITO BOM!','EXCELENTE!','INCRÍVEL!','FANTÁSTICO!','PERFEITO!','ÉPICO!','LENDÁRIO!','ABSURDO!','MESTRE!','◈ DEUS DOS PUZZLES ◈'];
  document.getElementById('win-lvl-txt').textContent=`NÍVEL ${level+1} — ${LEVEL_NAMES[level]} — ${grid}×${grid}`;
  document.getElementById('win-title').textContent='◈ '+(titles[level]||'INCRÍVEL!')+' ◈';
  document.getElementById('win-stars').textContent=stars;
  document.getElementById('win-stats').innerHTML=
    `TEMPO &nbsp;&nbsp;&nbsp;&nbsp; → ${mm}:${ss}<br>`+
    `MOVIMENTOS → ${moves}<br>`+
    `PEÇAS &nbsp;&nbsp;&nbsp;&nbsp; → ${total}/${total}<br>`+
    `PONTUAÇÃO → ${score.toLocaleString()}<br>`+
    `GRID &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; → ${grid}×${grid}`;

  // Buttons
  const btns=document.getElementById('win-btns');
  btns.innerHTML='';
  if(!isMax){
    const nb=document.createElement('button');
    nb.className='win-btn';nb.style.cssText='border-color:#04d98b;color:#04d98b';
    nb.textContent=`NÍVEL ${level+2}: ${LEVEL_NAMES[level+1]} (${LEVEL_GRIDS[level+1]}×${LEVEL_GRIDS[level+1]}) →`;
    nb.onclick=()=>{level++;document.getElementById('win-ov').classList.remove('show');loadImage(false);};
    btns.appendChild(nb);
  } else {
    const mb=document.createElement('div');
    mb.className='max-badge';mb.textContent='◈ NÍVEL MÁXIMO ATINGIDO — LENDA! ◈';
    btns.appendChild(mb);
  }
  const pb=document.createElement('button');
  pb.className='win-btn b-blue';pb.style.cssText='border-color:#87C3E3;color:#87C3E3';
  pb.textContent='📷 MESMA GRADE — NOVA FOTO';
  pb.onclick=()=>{document.getElementById('win-ov').classList.remove('show');loadImage(false);};
  btns.appendChild(pb);
  const rb=document.createElement('button');
  rb.className='win-btn';rb.style.cssText='border-color:#DA8BA0;color:#DA8BA0';
  rb.textContent='↩ RECOMEÇAR DO NÍVEL 1';
  rb.onclick=()=>{document.getElementById('win-ov').classList.remove('show');resetGame();};
  btns.appendChild(rb);

  document.getElementById('win-ov').classList.add('show');
  // Particles burst
  const cx=board.x+board.w/2,cy=board.y+board.h/2;
  [[cx,cy],[board.x,board.y],[board.x+board.w,board.y],
   [board.x,board.y+board.h],[board.x+board.w,board.y+board.h]].forEach(([px,py],i)=>{
    setTimeout(()=>spawnBurst(px,py,px===cx?100:50),i*150);
  });
}

function spawnBurst(cx,cy,n=60){
  const cols=[COL.r,COL.p,COL.a,COL.b,COL.o,'#ffffff','#00ffcc'];
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2,sp=3+Math.random()*10;
    const life=40+(Math.random()*40)|0;
    particles.push({x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-5,
      r:1.5+Math.random()*4,col:cols[(Math.random()*cols.length)|0],life,ml:life});
  }
}

// ════════════════════════════════════════════════
//  HUD
// ════════════════════════════════════════════════
function updateHUD(){
  const total=grid*grid;
  document.getElementById('s-moves').textContent=moves;
  document.getElementById('s-prog').textContent=placed+'/'+total;
  document.getElementById('prog-bar').style.width=(placed/total*100)+'%';
  document.getElementById('lv-tag').textContent='NÍVEL '+(level+1)+' / '+(MAX_LEVEL+1);
  document.getElementById('lv-name').textContent=LEVEL_NAMES[level];
  document.getElementById('lv-grid').textContent=grid+'×'+grid+' · '+total+' PEÇAS';
  updateLevelBar();
}
function tickTimer(){
  if(!active||!t0)return;
  const el=((Date.now()-t0)/1000)|0;
  document.getElementById('s-time').textContent=
    String((el/60)|0).padStart(2,'0')+':'+String(el%60).padStart(2,'0');
}
function hidePrev(){document.getElementById('prev-ov').classList.remove('show');}
</script>
